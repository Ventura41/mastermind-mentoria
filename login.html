<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MasterMind — Entrar na Plataforma</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:#080808;color:#f2f2f2;font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 40%,rgba(124,58,237,.15) 0%,transparent 70%);pointer-events:none}
.grid-bg{position:fixed;inset:0;background-image:linear-gradient(rgba(124,58,237,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(124,58,237,.04) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}

.top-bar{position:relative;z-index:10;padding:24px 40px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;background:linear-gradient(90deg,#f5a623,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none}
.back-link{font-size:13px;color:#666;text-decoration:none;display:flex;align-items:center;gap:6px;transition:color .2s}
.back-link:hover{color:#f2f2f2}

.center{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;z-index:10}

.card{background:#111;border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:44px 40px;width:100%;max-width:420px}
.card-title{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px;text-align:center}
.card-sub{font-size:13.5px;color:#666;text-align:center;margin-bottom:32px;line-height:1.6}

.tabs{display:flex;background:#161616;border-radius:8px;padding:4px;margin-bottom:28px}
.tab{flex:1;padding:9px;text-align:center;font-size:13px;font-weight:600;border-radius:6px;cursor:pointer;transition:all .2s;color:#666}
.tab.active{background:#1e1e1e;color:#f2f2f2;box-shadow:0 2px 8px rgba(0,0,0,.4)}

.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:#888;margin-bottom:7px;letter-spacing:.3px}
.field input{width:100%;background:#161616;border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:12px 14px;color:#f2f2f2;font-size:14px;font-family:'Inter',sans-serif;transition:border-color .2s;outline:none}
.field input:focus{border-color:rgba(245,166,35,.4)}
.field input::placeholder{color:#444}

.btn-submit{width:100%;background:linear-gradient(135deg,#d97706,#f5a623,#fbbf24);color:#000;font-family:'Syne',sans-serif;font-size:14px;font-weight:800;padding:14px;border-radius:8px;border:none;cursor:pointer;margin-top:8px;transition:all .25s;letter-spacing:.3px}
.btn-submit:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(245,166,35,.35)}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}

.divider{display:flex;align-items:center;gap:12px;margin:20px 0}
.divider-line{flex:1;height:1px;background:rgba(255,255,255,.07)}
.divider span{font-size:11px;color:#444}

.error-msg{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:10px 14px;font-size:13px;color:#f87171;margin-bottom:16px;display:none}
.success-msg{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);border-radius:8px;padding:10px 14px;font-size:13px;color:#4ade80;margin-bottom:16px;display:none}

.forgot{text-align:right;margin-top:-8px;margin-bottom:16px}
.forgot a{font-size:12px;color:#666;text-decoration:none;transition:color .2s}
.forgot a:hover{color:#f5a623}

.safe-note{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11.5px;color:#444;margin-top:16px}
</style>
</head>
<body>
<div class="bg"></div>
<div class="grid-bg"></div>

<div class="top-bar">
  <a href="index.html" class="logo">MasterMind</a>
  <a href="index.html" class="back-link">← Voltar ao site</a>
</div>

<div class="center">
  <div class="card">
    <div class="card-title">Área do Aluno</div>
    <div class="card-sub">Acesse sua plataforma e continue<br/>sua jornada de transformação.</div>

    <div class="tabs">
      <div class="tab active" id="tab-login" onclick="switchTab('login')">Entrar</div>
      <div class="tab" id="tab-signup" onclick="switchTab('signup')">Criar Conta</div>
    </div>

    <div id="error-box" class="error-msg"></div>
    <div id="success-box" class="success-msg"></div>

    <!-- LOGIN FORM -->
    <form id="form-login" onsubmit="doLogin(event)">
      <div class="field">
        <label>E-MAIL</label>
        <input type="email" id="login-email" placeholder="seu@email.com" required/>
      </div>
      <div class="field">
        <label>SENHA</label>
        <input type="password" id="login-password" placeholder="••••••••" required/>
      </div>
      <div class="forgot"><a href="#" onclick="doForgot(event)">Esqueci minha senha</a></div>
      <button type="submit" class="btn-submit" id="btn-login">Entrar na Plataforma →</button>
    </form>

    <!-- SIGNUP FORM -->
    <form id="form-signup" style="display:none" onsubmit="doSignup(event)">
      <div class="field">
        <label>NOME COMPLETO</label>
        <input type="text" id="signup-name" placeholder="Seu nome completo" required/>
      </div>
      <div class="field">
        <label>E-MAIL</label>
        <input type="email" id="signup-email" placeholder="seu@email.com" required/>
      </div>
      <div class="field">
        <label>SENHA</label>
        <input type="password" id="signup-password" placeholder="Mínimo 8 caracteres" minlength="8" required/>
      </div>
      <button type="submit" class="btn-submit" id="btn-signup">Criar Minha Conta →</button>
    </form>

    <div class="safe-note">🔒 Seus dados estão protegidos e seguros</div>
  </div>
</div>

<script>
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Redirect if already logged in
sb.auth.getSession().then(({ data: { session } }) => {
  if (session) window.location.href = 'plataforma.html';
});

function switchTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
  document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('form-signup').style.display = tab === 'signup' ? 'block' : 'none';
  hideMessages();
}

function showError(msg) {
  const el = document.getElementById('error-box');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('success-box').style.display = 'none';
}
function showSuccess(msg) {
  const el = document.getElementById('success-box');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('error-box').style.display = 'none';
}
function hideMessages() {
  document.getElementById('error-box').style.display = 'none';
  document.getElementById('success-box').style.display = 'none';
}

async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('btn-login');
  btn.disabled = true; btn.textContent = 'Entrando...';
  hideMessages();
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    showError('E-mail ou senha incorretos. Verifique seus dados.');
    btn.disabled = false; btn.textContent = 'Entrar na Plataforma →';
  } else {
    window.location.href = 'plataforma.html';
  }
}

async function doSignup(e) {
  e.preventDefault();
  const btn = document.getElementById('btn-signup');
  btn.disabled = true; btn.textContent = 'Criando conta...';
  hideMessages();
  const name = document.getElementById('signup-name').value;
  const email = document.getElementById('signup-email').value;
  const password = document.getElementById('signup-password').value;
  const { error } = await sb.auth.signUp({
    email, password,
    options: { data: { full_name: name } }
  });
  if (error) {
    showError(error.message);
    btn.disabled = false; btn.textContent = 'Criar Minha Conta →';
  } else {
    showSuccess('Conta criada! Verifique seu e-mail para confirmar o cadastro.');
    btn.disabled = false; btn.textContent = 'Criar Minha Conta →';
  }
}

async function doForgot(e) {
  e.preventDefault();
  const email = document.getElementById('login-email').value;
  if (!email) { showError('Digite seu e-mail primeiro.'); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/login.html'
  });
  if (!error) showSuccess('E-mail de recuperação enviado! Verifique sua caixa de entrada.');
  else showError('Erro ao enviar e-mail. Tente novamente.');
}
</script>
</body>
</html>
